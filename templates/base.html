<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarkus Smart Farm</title>
    <!-- 修改 1：使用 Flask 的標準寫法來連結 CSS，確保在 Render 部署時路徑不會出錯 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* 修改 2：直接在母片加上 Tarkus 招牌黃色，這樣即使 CSS 沒載入成功，基本色調還是在 */
        .nav { 
            background: #FFD700; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav a { 
            text-decoration: none; 
            color: #333; 
            font-weight: bold; 
            font-size: 14px;
        }
        .nav a:hover { color: #2e7d32; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/">首頁</a>
        <a href="/sales">產品介紹</a>
        <a href="/price">價格方案</a>
        <a href="/witness">成功案例</a>
        <a href="/partners">合作夥伴</a>
        <a href="/contact">聯絡我們</a>
        <!-- 修改 3：把登入按鈕做明顯一點，符合老闆 User Story 的入口導向 -->
        <a href="/login" style="color:#d32f2f; background:white; padding:5px 10px; border-radius:5px;">登入/註冊</a>
    </nav>

    <div class="content" style="min-height: 80vh;">
        {% block content %}{% endblock %}
    </div>

    <footer style="text-align:center; padding:30px; font-size:12px; background: #eee; margin-top: 50px;">
        <p>© 2024 Tarkustech Creative Co. Limited. Copyright 2019</p>
        <p>Driving AI Food Agriculture Solutions to K12 STEM Education</p>
    </footer>
</body>
</html>
